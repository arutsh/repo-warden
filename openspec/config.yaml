schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  proposal:
    - Say why before what, and list what is out of scope
  specs:
    - Give every requirement at least one WHEN/THEN scenario
    - Write scenarios only for behaviour a caller or user can observe, not for internals
    - Change an existing requirement with a MODIFIED delta instead of restating it as a new one
  design:
    - For each decision, name the alternative considered and why it was rejected
    - List the non-goals
  tasks:
    - Say how each task will be verified
    - Group tasks so that each group can be merged as one pull request
    - For each test task, name the existing test file it extends, or say why it needs a new one
operations:
  apply:
    guidance:
      - Before writing a test, search the existing tests for one that covers the behaviour, and extend it instead of adding a new one
