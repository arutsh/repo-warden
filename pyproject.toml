[project]
name = "repo-warden"
version = "0.1.0"
description = "A policy-enforcing capability broker that binds an AI coding agent to one git repository."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Norair Arutshyan" }]
dependencies = [
    # Fallback if the PyPI release disappears (fork commit identical to 0.2.0):
    # "mcp-airlock @ git+https://github.com/arutsh/mcp-airlock-broker@4e1793d3eedcd8180d8f449fa44aade4bcb9006d"
    "mcp-airlock==0.2.0",
    "mcp>=2.2",  # matches mcp-airlock 0.2.0's floor
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
repo-warden = "repo_warden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_warden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
