[project]
name = "repo-warden-devkit"
version = "0.1.0"
description = "Opt-in, agent-neutral dev-workflow rules for coding agents, git hooks and CI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Norair Arutshyan" }]
dependencies = ["pyyaml>=6.0.3"]

[project.scripts]
devkit = "devkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "repo-warden",  # only for the DEFAULT_SENSITIVE parity test
]

[tool.uv.sources]
repo-warden = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
